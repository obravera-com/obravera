# ObraVera release, stage 2 of 2 — check what was uploaded, then publish.
#
# THIS FILE DOES NOT RUN HERE. It is copied into the public releases repo
# (obravera-com/obravera) at .github/workflows/release-publish.yml.
#
# Run this after the locally-built DMGs and the Windows installer (built and
# signed on hurricane) have been uploaded to the draft.
#
# **It holds no secrets at all.** Verifying a signature needs only the public
# certificate chain, which is embedded in the artefact; the private key was
# used once, on Brady's Mac, and is never needed again. That is what makes
# this stage possible without the certificate being anywhere near GitHub.
#
# The check that earns its keep is `verify`: it downloads each DMG onto a
# fresh Mac that has never seen ObraVera and asks whether Gatekeeper would
# accept it. A DMG that was signed but not notarised, or notarised but not
# stapled, looks perfectly fine on the machine that built it — the ticket is
# already in the local database — and fails on a tester's. This catches that
# before anyone can download it, which is exactly the class of problem a
# manual release process produces. `verify-windows` does the same for the
# installer on a fresh Windows machine: signed by us and timestamped.

name: Release — publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Draft release tag to check and publish (e.g. v0.8.0)"
        required: true
        type: string

permissions: {}

env:
  # No job checks anything out, so there is no .git for gh to infer the
  # repository from: every `gh release` call needs this.
  GH_REPO: ${{ github.repository }}

jobs:
  assets:
    name: Check the release has everything
    runs-on: ubuntu-24.04  # pinned: -latest moved to 26.04 under us (#297)
    permissions:
      # write, not read: GitHub shows a DRAFT release only to a token that can
      # write to the repository. With read, `gh release view` answered "release
      # not found" and the first real publish (v0.8.0, 2026-09-27) stopped here.
      contents: write
    steps:
      - name: Every expected asset must be attached, and finished uploading
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The one place the expected set is written down. If a platform is
          # ever dropped — the Intel build, or Windows — remove its line here
          # rather than discovering the gap at publish time.
          #
          # The Windows installer is attached BY HAND: it is built and signed
          # on hurricane (from 0.9.0, V7; the PowerShell kit is gone, #292).
          # The build names it ObraVera-Setup-X.Y.Z.exe; it is uploaded as
          # ObraVera-Setup.exe so the download page's /releases/latest/
          # download/ObraVera-Setup.exe link works in every release, as the
          # DMG links do (#357). Forgetting it would publish a release whose
          # Windows download 404s while the macOS ones work, which reads as a
          # broken page rather than a missing file. That is the case this job
          # exists for.
          expected=(
            "ObraVera-arm64.dmg"
            "ObraVera-x86_64.dmg"
            "ObraVera-Setup.exe"
          )

          rows=$(gh release view "${TAG}" --json assets \
                   --jq '.assets[] | "\(.name)\t\(.state)\t\(.size)"')
          echo "Attached:"
          printf '%s\n' "${rows:-  (nothing)}" | sed 's/^/  /'
          echo

          problems=0
          for want in "${expected[@]}"; do
            row=$(printf '%s\n' "$rows" | awk -F'\t' -v n="$want" '$1 == n')
            if [ -z "$row" ]; then
              echo "::error::missing asset: ${want}"
              problems=1
              continue
            fi
            state=$(printf '%s' "$row" | cut -f2)
            size=$(printf '%s' "$row" | cut -f3)
            # A failed upload can leave an asset attached but unusable.
            if [ "$state" != "uploaded" ]; then
              echo "::error::${want} is in state '${state}', not 'uploaded'"
              problems=1
            elif [ "${size:-0}" -le 0 ]; then
              echo "::error::${want} is ${size} bytes"
              problems=1
            fi
          done

          # Anything else is reported but not fatal: SHA256SUMS is written by
          # the next job, and a re-run will legitimately find it here.
          while IFS=$'\t' read -r name _ _; do
            [ -z "$name" ] && continue
            [ "$name" = "SHA256SUMS" ] && continue
            printf '%s\n' "${expected[@]}" | grep -qxF "$name" \
              || echo "::warning::unexpected asset on the release: ${name}"
          done <<< "$rows"

          if [ "$problems" -ne 0 ]; then
            echo "::error::Refusing to publish an incomplete release. Attach the missing asset(s) to the draft, then run this again."
            exit 1
          fi
          echo "All ${#expected[@]} expected assets are attached and uploaded."

  verify:
    name: Gatekeeper check — ${{ matrix.arch }}
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each DMG is checked on its own architecture, which is what a
          # tester's machine does. Pinned rather than macos-latest: that
          # label has already moved to macOS 26 and will move again, and
          # macos-14 is unsupported from 2026-11-02.
          - arch: arm64
            runner: macos-15
            asset: ObraVera-arm64.dmg
          - arch: intel
            runner: macos-15-intel
            asset: ObraVera-x86_64.dmg
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # to download the DMG from the draft (see assets)
    steps:
      - name: Download the attached DMG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Fails loudly if the asset is absent: publishing a release that is
          # missing an architecture is a silent way to strand every tester on
          # that platform.
          gh release download "${TAG}" --pattern "${{ matrix.asset }}" --clobber

      - name: Would a tester's Mac accept this?
        run: |
          set -euo pipefail
          asset="${{ matrix.asset }}"
          # Signature: intact, and every nested binary too.
          codesign --verify --deep --strict --verbose=2 "$asset"
          # Notarisation ticket present in the file, so validation works with
          # no network. This is the one that fails when stapling was skipped.
          xcrun stapler validate "$asset"
          # What Gatekeeper actually decides.
          spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$asset"
          echo "$asset would be accepted."

      - name: Show who signed it
        run: |
          set -euo pipefail
          # Printed into the run log so the release has a durable record of
          # which identity signed it — a public certificate, not a secret.
          codesign --display --verbose=4 "${{ matrix.asset }}" 2>&1 \
            | grep -E "Authority|TeamIdentifier|Timestamp" || true

  verify-windows:
    name: Signature check — Windows installer
    needs: assets
    # Pinned rather than windows-latest, as the macOS runners are.
    runs-on: windows-2025
    permissions:
      contents: write # to download the installer from the draft (see assets)
    steps:
      - name: Download the attached installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "${TAG}" --pattern ObraVera-Setup.exe --clobber

      - name: Would a tester's Windows accept this?
        shell: pwsh
        run: |
          # Signed by us, and timestamped: Artifact Signing certificates last
          # three days, so a signature without a timestamp stops verifying
          # soon after the build (checklist C19). Renaming the file to
          # ObraVera-Setup.exe does not touch the signature.
          $sig = Get-AuthenticodeSignature -FilePath .\ObraVera-Setup.exe
          $sig | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($sig.Status -ne 'Valid') { throw "ObraVera-Setup.exe signature is $($sig.Status): $($sig.StatusMessage)" }
          if (-not $sig.TimeStamperCertificate) { throw "ObraVera-Setup.exe is signed but not timestamped" }
          if ($sig.SignerCertificate.Subject -notlike '*CN=Ridgway Brady*') { throw "ObraVera-Setup.exe is signed by $($sig.SignerCertificate.Subject), not CN=Ridgway Brady" }
          Write-Host "ObraVera-Setup.exe would be accepted: signed by CN=Ridgway Brady, timestamped."

  checksums:
    name: SHA256SUMS
    needs: [verify, verify-windows]
    runs-on: ubuntu-24.04  # pinned: -latest moved to 26.04 under us (#297)
    permissions:
      contents: write
    steps:
      - name: Checksum every attached asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p assets && cd assets
          # Computed from what is actually attached, not from what was built
          # locally — the file a tester downloads is the one that has to match
          # the published checksum.
          gh release download "${TAG}" --clobber
          rm -f SHA256SUMS
          shasum -a 256 -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${TAG}" SHA256SUMS --clobber

  publish:
    name: Publish
    needs: [assets, verify, verify-windows, checksums]
    runs-on: ubuntu-24.04  # pinned: -latest moved to 26.04 under us (#297)
    permissions:
      contents: write
    steps:
      - name: Make the release visible
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Only now does /releases/latest change, so only now does anyone
          # running the previous version see the in-app update notice (V6).
          gh release edit "${TAG}" --draft=false --latest
          echo "Published. Machines on the previous version will now see the update notice."
